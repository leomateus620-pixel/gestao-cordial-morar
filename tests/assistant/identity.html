<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Identidade · Assistente Cordial</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f8f7f4;
      color: #253b3e;
      font:
        14px system-ui,
        sans-serif;
      padding: 40px;
    }
    main {
      max-width: 1100px;
      margin: auto;
    }
    h1 {
      font-size: 30px;
      letter-spacing: -0.04em;
      margin: 0 0 30px;
    }
    h2 {
      font-size: 12px;
      font-weight: 600;
      margin: 0 0 24px;
    }
    section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    article {
      border-radius: 24px;
      padding: 28px;
      min-width: 0;
      background: white;
      border: 1px solid #e9e5df;
    }
    img {
      display: block;
      max-width: 100%;
      object-fit: contain;
    }
    .wordmark {
      width: 100%;
      height: 150px;
    }
    .dark {
      background: #253b3e;
      color: white;
    }
    .mark {
      height: 190px;
      width: 190px;
      margin: 0 auto;
    }
    .sizes {
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: center;
      margin-top: 30px;
    }
    .sizes img {
      width: var(--s);
      height: var(--s);
    }
    @media (max-width: 600px) {
      body {
        padding: 20px;
      }
      section {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <main>
    <h1>Assistente Cordial</h1>
    <section>
      <article class="dark">
        <h2>Cordial</h2>
        <img
          class="wordmark"
          src="/docs/assistente/identidade/cordial-restaurada.png"
          alt="Cordial Imóveis"
        />
      </article>
      <article>
        <h2>Morar</h2>
        <img
          class="wordmark"
          src="/docs/assistente/identidade/morar-restaurada.png"
          alt="Morar Imóveis"
        />
      </article>
    </section>
    <section>
      <article>
        <h2>Uma identidade para a equipe</h2>
        <img class="mark" src="/assistant/assistant-mark.webp" alt="Marca do Assistente" />
        <div class="sizes">
          <img style="--s: 16px" src="/assistant/assistant-mark.webp" alt="16 pixels" /><img
            style="--s: 24px"
            src="/assistant/assistant-mark.webp"
            alt="24 pixels"
          /><img style="--s: 40px" src="/assistant/assistant-mark.webp" alt="40 pixels" />
        </div>
      </article>
      <article class="dark">
        <h2>Modo escuro</h2>
        <img class="mark" src="/assistant/assistant-mark.webp" alt="Marca sobre fundo escuro" />
      </article>
    </section>
  </main>
</html>
